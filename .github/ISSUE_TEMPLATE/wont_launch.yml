name: macOS preparation or startup failure
description: Dump selection, first-run compilation, or an ARM64 startup diagnostic
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Tested game: CUSA01623 v1.02, identified by executable/module hashes.
        Other versions are not validated. Do not upload the dump, saves or generated game code.
  - type: input
    id: mac
    attributes:
      label: Mac chip, memory, macOS and app version
    validations:
      required: true
  - type: input
    id: game_version
    attributes:
      label: Game title ID and update version
      description: "The tested extracted metadata reports APP_VER 01.00; hashes are authoritative."
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Exact error and steps to reproduce
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Session or preparation log
      description: "Use the launcher's Open logs button. Data is in ~/Library/Application Support/God of War III ARM64. Review local paths before sharing."
    validations:
      required: true
