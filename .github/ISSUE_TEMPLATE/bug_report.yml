name: macOS bug or performance issue
description: ARM64 crashes, visual/audio/input problems, or uneven frame times
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        This tracker is for the Apple Silicon port. Include the exact diagnostic;
        a runtime failure does not by itself indicate a corrupt dump. Do not upload game files or saves.
  - type: input
    id: app_version
    attributes:
      label: App version or source commit
      placeholder: "0.4.1 or commit hash"
    validations:
      required: true
  - type: input
    id: mac
    attributes:
      label: Mac model, chip and memory
      placeholder: "MacBook Pro, M3 Max, 36 GB"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
    validations:
      required: true
  - type: input
    id: settings
    attributes:
      label: Resolution, MetalFX, FPS cap and display refresh rate
      placeholder: "4K output, Quality, 60 FPS, automatic 60 Hz"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened and how to reproduce it
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Session diagnostic
      description: "Use Open logs in the launcher. Review local paths before sharing. Include the exact error and real/generated FPS when relevant."
    validations:
      required: true
  - type: textarea
    id: capture
    attributes:
      label: Optional game capture
      description: "For visual issues, attach a capture from the game itself."
